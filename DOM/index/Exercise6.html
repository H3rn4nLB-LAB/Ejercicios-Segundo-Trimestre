<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio onLoad</title>

    <script>
        function saludar() {
            alert("¡Hola! Bienvenido a la página");
        }
    </script>
</head>

<body onload="saludar()">
    <h1>Página de ejemplo</h1>
    <p>Este mensaje aparece después del saludo.</p>
</body>
</html>
