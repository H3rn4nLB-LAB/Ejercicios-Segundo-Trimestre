<html>
  <body>
    <h2>Listado de precios de CD</h2>
    <p id="precios"></p>

    <script>
      const xhttp = new XMLHttpRequest();
      xhttp.onload = function(){
        const xmlDoc = this.responseXML;
        const cds = xmlDoc.getElementsbyTagName("CD");
        let txt = "";
        for(let i = 0; i<cds.length;i++){
          const price = cds[i].getElementsByTagName("PRICE")[0].childNodes[0].nodeValue;
          txt += price + "€<br>";
        }
        document.getElementById("precios").innerHTML = txt;
      }
      xhttp.open("GET", "https://www.w3schools.com/js/cd_catalog.xml");
      xhttp.send();
          
    </script>
  </body>
</html>
