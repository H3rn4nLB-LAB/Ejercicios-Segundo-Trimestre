<!DOCTYPE html>
<html>
<body>

<h2>Access Array Values</h2>
<p id="demo"></p>

<script>
const myJSON = '{"name":"John", "age":30, "cars":["Ford", "BMW", "Fiat"]}';
const myObj = JSON.parse(myJSON);

document.getElementById("demo").innerHTML = myObj.name + "<br>" + myObj.age + "<br>" + myObj.cars[0] + "<br>" + myObj.cars[1] + "<br>" + myObj.cars[2];
</script>

</body>
</html>
