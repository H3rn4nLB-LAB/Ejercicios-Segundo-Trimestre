<html>
<body>
<h2>Listado de títulos de CD</h2>
<p id="titulos"></p>

<script>
const xhttp = new XMLHttpRequest();
xhttp.onload = function() {
  const xmlDoc = this.responseXML;
  const cds = xmlDoc.getElementsByTagName("CD");
  let txt = "";
  for (let i = 0; i < cds.length; i++) {
    const title = cds[i].getElementsByTagName("TITLE")[0].childNodes[0].nodeValue;
    txt += title + "<br>";
  }
  document.getElementById("titulos").innerHTML = txt;
}
xhttp.open("GET", "https://www.w3schools.com/js/cd_catalog.xml");
xhttp.send();


</script>
</body>
</html>
